<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 英文學習助手</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6fa; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; padding: 32px; }
        h1 { text-align: center; color: #2a5d9f; }
        label { font-weight: bold; }
        textarea { width: 100%; min-height: 60px; font-size: 1.1em; margin: 8px 0 16px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2a5d9f; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 1em; cursor: pointer; }
        button:disabled { background: #aaa; }
        .result { margin-top: 24px; background: #f0f4fa; border-radius: 8px; padding: 16px; }
        .tts-btn { margin-left: 8px; background: #4caf50; }
        .example { color: #2a5d9f; margin: 8px 0; }
        .dialogue { margin: 8px 0; color: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 英文學習助手</h1>
        <label for="inputText">請輸入英文單字或句子：</label>
        <textarea id="inputText" placeholder="例如：apple 或 How are you?"></textarea>
        <button id="askBtn">送出</button>
        <div id="result" class="result" style="display:none;"></div>
    </div>
    <script>
    const askBtn = document.getElementById('askBtn');
    const inputText = document.getElementById('inputText');
    const resultDiv = document.getElementById('result');

    function speak(text) {
        const utter = new window.SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        window.speechSynthesis.speak(utter);
    }

    // 常用單字中英對照表
    const localDict = {
        apple: '蘋果',
        book: '書',
        cat: '貓',
        dog: '狗',
        table: '桌子',
        chair: '椅子',
        computer: '電腦',
        school: '學校',
        teacher: '老師',
        student: '學生',
        water: '水',
        food: '食物',
        car: '汽車',
        house: '房子',
        happy: '快樂的',
        sad: '難過的',
        run: '跑',
        walk: '走',
        eat: '吃',
        drink: '喝',
        // ...可自行擴充
    };

    askBtn.onclick = async function() {
        const userInput = inputText.value.trim();
        if (!userInput) return;
        askBtn.disabled = true;
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '查詢中...';

        // 查詢英文解釋
        let entry = null;
        let html = '';
        let word = userInput.toLowerCase();
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(userInput)}`);
            if (!response.ok) throw new Error('查無此單字');
            const data = await response.json();
            entry = data[0];
            word = entry.word.toLowerCase();
            html += `<b>${entry.word}</b> <button class='tts-btn' onclick='window.speakTTS("${entry.word}")'>🔊朗讀</button><br>`;
            if (entry.phonetics && entry.phonetics[0] && entry.phonetics[0].text) {
                html += `音標：${entry.phonetics[0].text}<br>`;
            }
        } catch (e) {
            resultDiv.innerHTML = '查無此單字，請重新輸入。';
            askBtn.disabled = false;
            return;
        }

        // 先查本地對照表
        let translation = localDict[word];
        if (!translation) {
            // 查不到再用 API
            try {
                const resTrans = await fetch('https://translate.astian.org/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: entry.word, source: 'en', target: 'zh', format: 'text' })
                });
                const dataTrans = await resTrans.json();
                translation = dataTrans.translatedText;
            } catch (e) {
                translation = '查詢失敗';
            }
        }
        html += `<b>中文翻譯：</b>${translation}<br>`;

        // 顯示英文解釋和例句
        if (entry.meanings && entry.meanings.length > 0) {
            html += '<ul>';
            entry.meanings.forEach(meaning => {
                html += `<li><b>${meaning.partOfSpeech}</b>：${meaning.definitions[0].definition}`;
                if (meaning.definitions[0].example) {
                    html += `<br>例句：<span class='example'>${meaning.definitions[0].example}</span> <button class='tts-btn' onclick='window.speakTTS(\`${meaning.definitions[0].example.replace(/'/g, "\\'")}\`)'>🔊朗讀</button>`;
                }
                html += '</li>';
            });
            html += '</ul>';
        }
        resultDiv.innerHTML = html;
        askBtn.disabled = false;
    };
    window.speakTTS = speak;
    </script>
</body>
</html>
